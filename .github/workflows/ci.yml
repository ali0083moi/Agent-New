name: CI/CD

# Every push runs the tests. Pushes to the default branch that pass are published to the `release` branch
# (backend + pre-built web UI). Servers installed with deploy/install.sh pull `release` and update themselves.

on:
  push:
    branches-ignore: [release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Test
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck & build
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  release:
    name: Publish release branch
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
      - name: Assemble release tree
        run: |
          set -euo pipefail
          mkdir -p out
          rsync -a --exclude '__pycache__' --exclude '.pytest_cache' --exclude '.venv' backend out/
          mkdir -p out/frontend && rsync -a frontend/dist out/frontend/
          rsync -a deploy out/
          cp .env.example README.md out/
          SUBJECT="$(git log -1 --pretty=%s)"
          python3 - "$GITHUB_SHA" "$SUBJECT" > out/VERSION.json <<'PY'
          import json, sys, datetime as dt
          print(json.dumps({"sha": sys.argv[1], "short": sys.argv[1][:7], "subject": sys.argv[2],
                            "built_at": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}, ensure_ascii=False))
          PY
      - name: Push to release branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch origin release
            git worktree add rel origin/release
            git -C rel checkout -B release
          else
            git worktree add --orphan -b release rel
          fi
          rsync -a --delete --exclude .git out/ rel/
          cd rel
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "release ${GITHUB_SHA::7}: $(git -C .. log -1 --pretty=%s)"
          git push origin release
